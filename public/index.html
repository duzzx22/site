<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09090b">
    <meta name="description" content="Um espaço pessoal minimalista.">
    <title>Site</title>
    <link rel="stylesheet" href="./style.css">
    <script src="./script.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <nav class="tabs" role="tablist" aria-label="Navegação principal">
          <button class="tab" id="tab-01" type="button" role="tab"
            aria-selected="false" aria-controls="panel-01" aria-label="Aba 1" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="7.5" />
              <path d="M12 4.5v15M4.5 12h15" />
            </svg>
          </button>
          <button class="tab" id="tab-02" type="button" role="tab"
            aria-selected="false" aria-controls="panel-02" aria-label="Aba 2" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 12h2l2-5 4 10 3-8 2 3h3" />
            </svg>
          </button>
          <button class="tab is-active" id="tab-03" type="button" role="tab"
            aria-selected="true" aria-controls="panel-03" aria-label="Aba 3" tabindex="0">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m12 3 1.8 6.2L20 11l-6.2 1.8L12 19l-1.8-6.2L4 11l6.2-1.8L12 3Z" />
              <path d="m19 16 .8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z" />
            </svg>
          </button>
          <button class="tab" id="tab-04" type="button" role="tab"
            aria-selected="false" aria-controls="panel-04" aria-label="Aba 4" tabindex="-1">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4.5" y="4.5" width="6" height="6" rx="1.5" />
              <rect x="13.5" y="4.5" width="6" height="6" rx="1.5" />
              <rect x="4.5" y="13.5" width="6" height="6" rx="1.5" />
              <rect x="13.5" y="13.5" width="6" height="6" rx="1.5" />
            </svg>
          </button>
        </nav>
      </header>

      <main class="content">
        <section class="panel" id="panel-01" role="tabpanel"
          aria-labelledby="tab-01" tabindex="0" hidden></section>
        <section class="panel" id="panel-02" role="tabpanel"
          aria-labelledby="tab-02" tabindex="0" hidden></section>
        <section class="panel panel--reserved" id="panel-03" role="tabpanel"
          aria-labelledby="tab-03" tabindex="0">
          <p>Em breve</p>
        </section>
        <section class="panel" id="panel-04" role="tabpanel"
          aria-labelledby="tab-04" tabindex="0" hidden></section>
      </main>

      <footer class="site-footer">
        <div class="player" role="group" aria-label="Player de música">
          <audio id="audio" src="./music.mp3" preload="metadata"></audio>
          <button class="player-button play-button" id="play-button" type="button"
            aria-label="Reproduzir música" aria-pressed="false">
            <svg class="play-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="m8 5 11 7-11 7z" />
            </svg>
            <svg class="pause-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M7 5h4v14H7zm6 0h4v14h-4z" />
            </svg>
          </button>
          <button class="player-button repeat-button is-active" id="repeat-button" type="button"
            aria-label="Repetição ativada" aria-pressed="true">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m17 2 4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-3v2a3 3 0 0 1-3 3H3" />
            </svg>
          </button>
          <label class="volume">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 10v4h4l5 4V6l-5 4H4Zm12-2a6 6 0 0 1 0 8" />
            </svg>
            <span class="visually-hidden">Volume</span>
            <input id="volume" type="range" min="0" max="1" step="0.01"
              value="0.5" aria-label="Volume">
          </label>
        </div>
        <p class="playback-status" id="playback-status" role="status"
          aria-live="polite" hidden></p>
      </footer>
    </div>
  </body>
</html>
